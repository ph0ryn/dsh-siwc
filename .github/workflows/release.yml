name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, "Tag must match package.json version");
          NODE

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Build and pack
        run: pnpm pack --pack-destination artifacts

      - name: Set up npm for trusted publishing
        run: npm install --global npm@11

      - name: Publish to npm
        run: |
          npm_tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm_tag=next
          fi
          npm publish ./artifacts/*.tgz --access public --tag "$npm_tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.tgz "${args[@]}"
